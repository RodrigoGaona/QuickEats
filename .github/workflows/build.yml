name: SonarQube
on:
  push:
    branches:
      - Master
      - master
      - develop # <-- Añadido para la rama de desarrollo
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deshabilitar clonaciones superficiales para un análisis completo
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # 1. Comienzo del análisis (dotnet sonarscanner begin)
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"RodrigoGaona_QuickEats" /o:"rodrigogaona" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

          # 2. CORRECCIÓN: Especificar el archivo de solución correcto.
          # Asumiendo que se llama QuickEats.sln y está en la raíz.
          # SI NO FUNCIONA, PRUEBA CON EL NOMBRE EXACTO DE TU .sln, 
          # o agrega la ruta relativa (ej: 'src/QuickEats.sln').
          dotnet build QuickEats.sln 

          # 3. Finalizar el análisis y subir el reporte (dotnet sonarscanner end)
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
