name: CI - Build and Test .NET Projects

on:
  push:
    branches:
      - develop  # Ejecutar en la rama de desarrollo

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x' # Asegúrate de que esta versión coincida con tu proyecto
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Projects
      # ¡CORRECCIÓN CLAVE! Se apunta al archivo csproj de la API.
      run: dotnet build FastFoodAPI/FastFoodAPI.csproj --configuration Release --no-restore
    
    - name: Run Unit Tests
      # ¡CORRECCIÓN CLAVE! Se apunta al archivo csproj de las pruebas.
      run: dotnet test FastFoodAPI.Tests/FastFoodAPI.Tests.csproj --no-restore
      
    - name: Publish API for Deployment (CD Artifact)
      run: dotnet publish FastFoodAPI/FastFoodAPI.csproj -c Release -o ./publish_api
      
    - name: Archive API Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fastfood-api-artifact
        path: ./publish_api
